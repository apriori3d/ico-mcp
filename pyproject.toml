[project]
name = "ico-mcp"
version = "0.1.0"
description = "Universal MCP server on top of the ICO framework: agents build pipelines from a registry of typed operators and crystallize repeated work into stable operators."
readme = "CLAUDE.md"
license = { text = "Apache 2.0" }
authors = [{ name = "Sergei Shumilin", email = "shumilinss@gmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "anyio>=4.15",
    "ico",
    "mcp>=2.3.0",
]

[project.scripts]
ico-mcp = "ico_mcp.server:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.sources]
# Development: the sibling ICO checkout, editable.
ico = { path = "../ico", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ico_mcp"]

# ───────────────────────────────────────────────
# Ruff (same settings as ico)
# ───────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# ───────────────────────────────────────────────
# pytest
# ───────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
