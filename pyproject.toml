[project]
name = "ico-mcp"
version = "0.1.2"
description = "An MCP server on top of ICO: an agent writes typed operators, composes them into pipelines, runs and profiles them, and turns what works into reviewed code."
readme = "README.md"
license = { text = "Apache 2.0" }
authors = [{ name = "Sergei Shumilin", email = "shumilinss@gmail.com" }]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["mcp", "agents", "pipelines", "ico"]
dependencies = [
    "anyio>=4.15",
    "apriori-ico>=0.1.1",
    "mcp>=2.3.0",
    # Type-checks proposed operators at run time (propose_operator).
    "pyright>=1.1.414",
]

[project.scripts]
ico-mcp = "ico_mcp.server:main"

[project.urls]
Homepage = "https://github.com/apriori3d/ico-mcp"
Repository = "https://github.com/apriori3d/ico-mcp"
Issues = "https://github.com/apriori3d/ico-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.sources]
# Development: the sibling ICO checkout, editable.
apriori-ico = { path = "../ico", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ico_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src/ico_mcp", "/README.md", "/LICENSE"]

# ───────────────────────────────────────────────
# Ruff (same settings as ico)
# ───────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# ───────────────────────────────────────────────
# pytest
# ───────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
