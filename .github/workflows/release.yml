name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: The tag matches the version
      run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

    - name: Build
      run: uv build

    - name: Smoke test the wheel (apriori-ico from PyPI)
      run: |
        uv run --isolated --no-project --with dist/*.whl \
          ico-mcp init "$RUNNER_TEMP/demo" --package demo
        test -f "$RUNNER_TEMP/demo/ico.toml"
        ! grep -q "tool.uv.sources" "$RUNNER_TEMP/demo/pyproject.toml"
        uv run --isolated --no-project --with dist/*.whl \
          python -c "import ico_mcp.server"

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: write  # the GitHub release
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
